note: >-
  Domain-standard conformance for the Indian Institute of Technology Kanpur, probed against the
  Kin Score `education` regime standards[] list. Reward-only: a standard is listed as `conformant`
  only where a live artifact or response evidences it. Every standard probed and NOT found is
  recorded below as `not_found` with the probe that failed, so the absence is a measurement rather
  than a silence.

conformant:
  - standard: oai-pmh
    name: Open Archives Initiative Protocol for Metadata Harvesting 2.0
    surface: IIT Kanpur PKK Library OAI-PMH API
    x-operator: institution
    contract: openapi/iit-kanpur-oai-pmh-api-openapi.yml
    evidence:
      - url: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl?verb=Identify
        status: 200
        locator: OAI-PMH/Identify/protocolVersion
        value: '2.0'
        detail: >-
          repositoryName "PKK Library", adminEmail libcirc@iitk.ac.in, granularity
          YYYY-MM-DDThh:mm:ssZ, deletedRecord persistent, earliestDatestamp 2016-09-28T08:43:15Z.
      - url: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl?verb=ListMetadataFormats
        status: 200
        locator: OAI-PMH/ListMetadataFormats/metadataFormat/metadataPrefix
        value: oai_dc, marc21, marcxml
      - url: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl?verb=ListIdentifiers&metadataPrefix=oai_dc
        status: 200
        locator: OAI-PMH/ListIdentifiers
        detail: Returns live record identifiers with datestamps; harvesting works end to end.
    caveats:
      - >-
        The repository's own Identify response advertises baseURL
        https://libserv.iitk.ac.in/opac/oai.pl, which returns 404 (probed 2026-09-01). The working
        base URL is https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl. A harvester that trusts the
        self-declared baseURL, as the protocol invites it to, will fail against this repository.
      - >-
        ListSets returns error code noSetHierarchy — the repository defines no OAI sets, so
        set-scoped harvesting is unavailable.

