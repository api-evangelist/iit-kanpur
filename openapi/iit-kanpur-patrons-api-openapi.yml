tags:
- description: 'Manage patrons

    '
  name: patrons
  x-displayName: Patrons
paths:
  /auth/password/validation:
    post:
      tags:
      - patrons
      summary: Check validity of username and password
      operationId: validateUserAndPassword
      requestBody:
        required: false
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                identifier:
                  description: A patron identifier (`userid` or `cardnumber`)
                  type: string
                password:
                  description: Password (plain text)
                  type: string
                userid:
                  description: A patron userid
                  type: string
              required:
              - password
              type: object
        description: 'A JSON object containing a patron identifier and password information.


          The identifier will be used to match patrons on the database using the

          following order:


          * userid

          * cardnumber


          Optionally, you can specify the `userid` attribute if you don''t want it

          to be checked against the patron cardnumbers.

          '
      responses:
        '201':
          description: Validation successful
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  cardnumber:
                    description: cardnumber for the validated patron
                    type: string
                  patron_id:
                    description: Internal patron identifier
                    type: integer
                  userid:
                    description: userid for the validated patron
                    type: string
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '404':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '500':
          description: 'Internal server error. Possible `error_code` attribute values:


            * `internal_server_error`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '501':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '503':
          description: Under maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
