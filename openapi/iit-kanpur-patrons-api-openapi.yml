    post:
      tags:
      - patrons
      summary: Add patron
      operationId: addPatron
      parameters:
      - name: x-koha-override
        in: header
        required: false
        description: Overrides list sent as a request header
        schema:
          type: array
          items:
            enum:
            - welcome_yes
            - welcome_no
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patron_yaml'
        description: A JSON object containing information about the new patron
      responses:
        '201':
          description: A successfully created patron
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/patron_yaml'
