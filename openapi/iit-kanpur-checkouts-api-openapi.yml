        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: x-koha-request-id
        in: header
        required: false
        description: Request id header
        schema:
          type: integer
      - name: checked_in
        in: query
        required: false
        description: By default, current checkouts are returned, when this is true then checked in checkouts are returned as result.
        schema:
          type: boolean
      - name: x-koha-embed
