openapi: 3.2.0
info:
  contact:
    name: Koha Development Team
    url: https://koha-community.org/
  description: '## Background


    The API supports two sets of endpoints, one targetted at library staff and the other at at library users.'
  license:
    name: GPL v3,
    url: http://www.gnu.org/licenses/gpl.txt
  title: Koha REST Authorised Value Categories API
  version: '1'
servers:
- url: https://libserv.iitk.ac.in/api/v1
  description: PKK Library Koha REST API (production)
tags:
- description: Manage authorised value categories
  name: authorised_value_categories
  x-displayName: Authorised value categories
paths:
  /authorised_value_categories:
    get:
      tags:
      - authorised_value_categories
      summary: List authorised value categories
      operationId: listAuthorisedValueCategories
      parameters:
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        schema:
          type: array
          items:
            enum:
            - authorised_values
            type: string
      - name: _match
        in: query
        required: false
        description: Matching criteria
        schema:
          type: string
          enum:
          - contains
          - exact
          - starts_with
          - ends_with
      - name: _order_by
        in: query
        required: false
        description: Sorting criteria
        schema:
          type: array
          items:
            type: string
      - name: _page
        in: query
        required: false
        description: Page number, for paginated object listing
        schema:
          type: integer
      - name: _per_page
        in: query
        required: false
        description: Page size, for paginated object listing
        schema:
          type: integer
      - name: q
        in: query
        required: false
        description: Query filter sent as a request parameter
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
        description: Query filter sent through request"s body
      responses:
        '200':
          description: A list of authorised value categories
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/authorised_value_category_yaml'
                type: array
        '400':
          description: "Bad request. Possible `error_code` attribute values:\n\n  * `invalid_query`\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '401':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '500':
          description: 'Internal server error. Possible `error_code` attribute values:

            * `internal_server_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '501':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '503':
          description: Under maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
components:
  schemas:
    authorised_value_category_yaml:
      additionalProperties: false
      properties:
        authorised_values:
          description: This category's authorised values
          items:
            $ref: '#/components/schemas/authorised_value_yaml'
          type: array
        category_name:
          description: Unique category name primary key
          readOnly: true
          type: string
        is_system:
          description: Is this category system or not
          readOnly: true
          type: boolean
      required:
      - category_name
      type: object
    authorised_value_yaml:
      additionalProperties: false
      properties:
        authorised_value_id:
          description: internally assigned authorised value identifier
          readOnly: true
          type: integer
        category_name:
          description: the category of this authorised value
          type: string
        description:
          description: The staff interface description for this authorised value
          type: string
        image_url:
          description: The url of the image associated with this authorised value, if any
          type:
          - string
          - 'null'
        opac_description:
          description: The public interface description of this authorised value, if set"
          type:
          - string
          - 'null'
        value:
          description: The code for this authorised value
          type: string
      required:
      - category_name
      - value
      - description
      type: object
    DefaultResponse:
      properties:
        errors:
          items:
            properties:
              message:
                type: string
              path:
                type: string
            required:
            - message
            type: object
          type: array
      required:
      - errors
      type: object
    error_yaml:
      additionalProperties: true
      properties:
        error:
          description: Error message
          type: string
        error_code:
          description: Error code
          type: string
      type: object
