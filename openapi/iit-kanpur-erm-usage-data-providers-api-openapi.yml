        schema:
          type: string
      - name: api_key
        in: query
        required: false
        description: Case insensitive search on usage_data_provider api_key
        schema:
          type: string
      - name: requestor_name
        in: query
        required: false
        description: Case insensitive search on usage_data_provider requestor_name
        schema:
          type: string
      - name: requestor_email
        in: query
        required: false
