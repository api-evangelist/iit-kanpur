components:
  schemas:
    erm_counter_log_yaml:
      additionalProperties: false
      properties:
        borrowernumber:
          description: borrowernumber of the counter_log
          type:
          - integer
          - 'null'
        counter_files_id:
          description: counter_files_id of the counter_log
          type:
          - integer
          - 'null'
        erm_counter_log_id:
          description: internally assigned counter_log identifier
          readOnly: true
          type: integer
        filename:
          description: filename of the counter_file
          type:
          - string
          - 'null'
        importdate:
          description: Timestamp for the date of upload
          format: date-time
          type: string
        logdetails:
          description: logdetails of the counter_log
          type:
          - string
          - 'null'
        usage_data_provider_id:
          description: logdetails of the counter_log
          type:
          - integer
          - 'null'
      required:
      - filename
      - borrowernumber
      - counter_files_id
      type: object
    DefaultResponse:
      properties:
        errors:
          items:
            properties:
              message:
                type: string
              path:
                type: string
            required:
            - message
            type: object
          type: array
      required:
      - errors
      type: object
    error_yaml:
      additionalProperties: true
      properties:
        error:
          description: Error message
          type: string
        error_code:
          description: Error code
          type: string
      type: object
    erm_usage_database_yaml:
      additionalProperties: false
      properties:
        database:
          description: name of the database
          type:
          - string
          - 'null'
        database_id:
          description: internally assigned database identifier
          readOnly: true
          type: integer
        erm_usage_muses:
          description: usage mus
          items:
            $ref: '#/components/schemas/erm_usage_mus_yaml'
          type: array
        erm_usage_yuses:
          description: usage yus
          items:
            $ref: '#/components/schemas/erm_usage_yus_yaml'
          type: array
        platform:
          description: name of the platform
          type:
          - string
          - 'null'
        publisher:
          description: publisher of the database data
          type:
          - string
          - 'null'
        publisher_id:
          description: publisher_id of the database data
          type:
          - string
          - 'null'
        usage_data_provider_id:
          description: usage_data_provider the database is harvested by
          type: integer
      required:
      - database
      - usage_data_provider_id
      type: object
    erm_usage_data_provider_yaml:
      additionalProperties: false
      properties:
        active:
          description: status of the harvester
          type:
          - integer
          - 'null'
        aggregator:
          description: aggregator of the harvester
          type:
          - string
          - 'null'
        api_key:
          description: api_key of the harvester
          type:
          - string
          - 'null'
        counter_files:
          description: counter files
          items:
            $ref: '#/components/schemas/erm_counter_file_yaml'
          type: array
        customer_id:
          description: customer_id of the harvester
          type:
          - string
          - 'null'
        description:
          description: description of the data provider
          type:
          - string
          - 'null'
        earliest_database:
          description: time period of data harvested
          type:
          - string
          - 'null'
        earliest_item:
          description: time period of data harvested
          type:
          - string
          - 'null'
        earliest_platform:
          description: time period of data harvested
          type:
          - string
          - 'null'
        earliest_title:
          description: time period of data harvested
          type:
          - string
          - 'null'
        erm_usage_data_provider_id:
          description: internally assigned data provider identifier
          readOnly: true
          type: integer
        erm_usage_databases:
          description: usage databases
          items:
            $ref: '#/components/schemas/erm_usage_database_yaml'
          type: array
        erm_usage_items:
          description: usage items
          items:
            $ref: '#/components/schemas/erm_usage_item_yaml'
          type: array
        erm_usage_platforms:
          description: usage platforms
          items:
            $ref: '#/components/schemas/erm_usage_platform_yaml'
          type: array
        erm_usage_titles:
          description: usage titles
