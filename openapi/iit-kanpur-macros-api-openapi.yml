      summary: Get shared advanced editor macro
      operationId: getsharedAdvancedEditorMacro
      parameters:
      - name: advancededitormacro_id
        in: path
        required: true
        description: Advanced editor macro internal identifier
        schema:
          type: integer
      responses:
        '200':
          description: A macro
          content:
