        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '501':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '503':
          description: Under maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
    put:
      tags:
      - Macros
      summary: Update shared advanced editor macro
      operationId: updatesharedAdvancedEditorMacro
      parameters:
      - name: advancededitormacro_id
        in: path
        required: true
        description: Advanced editor macro internal identifier
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/advancededitormacro_yaml'
        description: An advanced editor macro object
      responses:
        '200':
          description: An advanced editor macro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/advancededitormacro_yaml'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
