        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '404':
          description: AdvancedEditorMacro not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '500':
