              schema:
                $ref: '#/components/schemas/error_yaml'
components:
  schemas:
    advancededitormacro_yaml:
      additionalProperties: false
      properties:
        macro_id:
          description: Internal advanced editor macro identifier
          readOnly: true
          type: integer
        macro_text:
          description: macro text
          type:
          - string
          - 'null'
        name:
          description: macro name
          type: string
        patron_id:
          description: borrower number
          type:
          - integer
          - 'null'
        shared:
          description: is macro shared
          type:
          - boolean
          - 'null'
      required:
      - name
      - macro_text
      - patron_id
      - shared
      type: object
    DefaultResponse:
      properties:
        errors:
          items:
            properties:
              message:
                type: string
              path:
                type: string
            required:
            - message
            type: object
          type: array
      required:
      - errors
      type: object
    error_yaml:
      additionalProperties: true
      properties:
        error:
          description: Error message
          type: string
        error_code:
          description: Error code
          type: string
      type: object
