  /transfer_limits/batch:
    delete:
      tags:
      - transfer_limits
      summary: Batch delete transfer limits
      description: This endpoint works just like [the POST version](#op-post-transfer_limits-batch), except
        it deletes transfer in batch rather than creating them.
      operationId: batchDeleteTransferLimits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                collection_code:
                  description: Authorized value for the collection code associated with this limit
                  type:
                  - string
                  - 'null'
                from_library_id:
                  description: Internal library id for which library the item is coming from
                  type: string
                item_type:
                  description: Itemtype defining the type for this limi
                  type:
                  - string
                  - 'null'
                to_library_id:
                  description: Internal library id for which library the item is going to
                  type: string
              type: object
        description: A JSON object containing information about new transfer limits.
      responses:
        '204':
          description: Transfer limits deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '404':
          description: Library not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '500':
          description: 'Internal server error. Possible `error_code` attribute values:


            * `internal_server_error`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '501':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '503':
          description: Under maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
    post:
      tags:
      - transfer_limits
      summary: Batch add transfer limits
      description: "\nThis resource batch creates new transfer limits based on the given data.\nTransfer\
        \ limits can be defined based on `collection_code` or `item_type`. The endpoint only accepts one\
        \ at a time, and which one is used will depend on the value of the `BranchTransferLimitsType`\
        \ system preference.\nFor example, if the paramters `to_library_id: 'BranchA'` and `item_type:\
        \ 'BOOK'` are passed in new transfer limits for `BOOK`s will be created, with one transfer limit\
        \ each for all the branches defined in Koha. Given 4 branches, 3 limits would be created:\n* to_library_id:\
        \ 'BranchA', from_library_id: 'BranchB', item_type: 'BOOK' * to_library_id: 'BranchA', from_library_id:\
        \ 'BranchC', item_type: 'BOOK' * to_library_id: 'BranchA', from_library_id: 'BranchD', item_type:\
        \ 'BOOK'\n\nThe body of the query would look like\n``` {\n    'to_library_id': 'BranchA',\n  \
        \  'item_type': 'BOOK'\n\n} ```\nAs another example, imagine we have an itemtype that is never\
        \ supposed to be transferred to another library. If we call that itemtype `LOCAL_ONLY` we would\
        \ need to just pass `item_type: 'LOCAL_ONLY'`, which would create transfer limits for all libraries,\
        \ meaning those items would never be allowed to transfer to another library. The body of the query\
        \ would look like\n``` {\n    'item_type': 'LOCAL_ONLY'\n} ```\n"
      operationId: batchAddTransferLimits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                collection_code:
                  description: Authorized value for the collection code associated with this limit
                  type:
                  - string
                  - 'null'
                from_library_id:
                  description: Internal library id for which library the item is coming from
                  type: string
                item_type:
                  description: Itemtype defining the type for this limi
                  type:
                  - string
                  - 'null'
                to_library_id:
                  description: Internal library id for which library the item is going to
                  type: string
              type: object
        description: A JSON object containing information about new transfer limits.
      responses:
        '201':
          description: A list of transfer limits
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/transfer_limit_yaml'
                type: array
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '404':
          description: Default response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultResponse'
        '409':
          description: Conflict in creating resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '500':
          description: 'Internal server error. Possible `error_code` attribute values:


            * `internal_server_error`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_yaml'
        '501':
          description: Default response.
