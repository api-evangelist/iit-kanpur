reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      IIT Kanpur has no unified central developer portal. The verifiable public
      programmatic footprint is the P.K. Kelkar Library Koha system: a live
      OAI-PMH 2.0 endpoint (Identify and ListMetadataFormats both returned valid
      OAI-PMH 2.0 XML, repository "PKK Library", oai_dc supported) and a Koha
      ILS-DI page (HTTP 200, Koha 23.11). The Koha SRU explain endpoint returned
      404 and was excluded. The Pingala ERP/SIS resolves but is login-gated with
      no documented public API. No single official institutional GitHub org was
      found (only club/department orgs). Only confirmed, live URLs were cataloged;
      no endpoints were fabricated.
    endpoints:
      - url: https://www.iitk.ac.in/
        status: 200
        note: Official institutional website; resolves live.
      - url: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl?verb=Identify
        status: 200
        note: Live OAI-PMH 2.0 Identify; repository "PKK Library", earliest datestamp 2016.
      - url: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl?verb=ListMetadataFormats
