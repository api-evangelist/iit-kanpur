---
aid: iit-kanpur
name: Indian Institute of Technology Kanpur
description: >-
  The Indian Institute of Technology Kanpur (IIT Kanpur), founded in 1959 in
  Kanpur, Uttar Pradesh, is an Institute of National Importance and one of
  India's premier engineering and research institutions. It operates no central
  developer portal, no open-data portal, and no institutional GitHub
  organization. Its entire verified public programmatic footprint is the P.K.
  Kelkar (PKK) Library, which self-hosts Koha 23.11 on the institution's own
  host libserv.iitk.ac.in and exposes exactly two live machine-readable
  surfaces: a Koha REST API at /api/v1 whose /public/* subset answers
  unauthenticated (the rest returns 401), and an OAI-PMH 2.0 metadata-harvesting
  endpoint serving oai_dc, marc21 and marcxml. Because Koha is open-source
  software the library runs itself rather than a hosted vendor platform, both
  surfaces are institution-operated even though the Koha community authored the
  contract. Two earlier claims in this profile were wrong and are corrected
  here: the ILS-DI service is NOT available — its describe page renders 200 but
  every actual call returns "ILS-DI is disabled" — and this repository's 64
  apis[] entries were one Koha contract split by tag, presenting a single
  library API as 64 surfaces. Pingala, the ERP/SIS, is login-gated with no
  documented public API. No Shibboleth/SAML identity federation, no DataCite or
  Crossref membership, and no research-data repository were found; the
  institution is registered in ROR. Numerous student clubs and departments run
  their own GitHub organizations, but none is institution-operated.
