  reason: covered
  detail: >-
    Both institution-operated surfaces were probed live and both answer. The
    Koha REST API at https://libserv.iitk.ac.in/api/v1 serves its own
    specification (200, 667KB), renders a Swagger UI at /api/v1/.html (200), and
    answers /api/v1/public/libraries anonymously with IIT Kanpur's own records
    (200); staff routes return 401, which is a correct auth boundary, not a
    block. The OAI-PMH endpoint answers Identify, ListMetadataFormats and
    ListIdentifiers (all 200). What is genuinely absent is absent, not
    unreachable: api.iitk.ac.in, data.iitk.ac.in, ir.iitk.ac.in,
    idp.iitk.ac.in, webshib.iitk.ac.in, students.iitk.ac.in and
    library.iitk.ac.in all fail DNS resolution; there is no institutional GitHub
    organization (api.github.com/orgs/iitk returns 404 — only student club orgs
    such as pclubiitk and AUV-IITK exist); no Indian identity federation is
    listed among eduGAIN's 92 federations; DataCite and Crossref return zero
    matches. The previously claimed ILS-DI service is disabled at the source:
    the describe page returns 200 but a real call returns
    <code>NotAllowed</code> "ILS-DI is disabled", which is exactly the
    link-presence-is-not-liveness trap, and the claim has been removed.
