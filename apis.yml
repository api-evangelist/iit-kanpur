- aid: iit-kanpur:iit-kanpur-oai-pmh-api
  name: IIT Kanpur PKK Library OAI-PMH API
  description: >-
    OAI-PMH 2.0 metadata-harvesting endpoint for the P.K. Kelkar Library catalog, operated on the institution's
    own Koha installation. Verified live on 2026-09-01: Identify returns repositoryName "PKK Library",
    adminEmail libcirc@iitk.ac.in, granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord persistent and earliestDatestamp
    2016-09-28T08:43:15Z; ListMetadataFormats returns oai_dc, marc21 and marcxml; ListIdentifiers returns
    live records. ListSets returns noSetHierarchy — no sets are defined. Requires no authentication. OAI-PMH
    is a named standard in the Kin Score education regime and this is IIT Kanpur's one domain-standard
    conformance.
  humanURL: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl?verb=Identify
  baseURL: https://libserv.iitk.ac.in/cgi-bin/koha/oai.pl
  x-operator: institution
  x-operator-basis: >-
    Host libserv.iitk.ac.in is the institution's own; OAI-PMH is an Open Archives Initiative protocol,
    not a vendor product, and the repository it exposes is IIT Kanpur's own catalog.
  tags:
