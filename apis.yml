- aid: iit-kanpur:iit-kanpur-ror-registry-record
  name: IIT Kanpur ROR Registry Record
  description: >-
    IIT Kanpur's registration in the Research Organization Registry (ROR), identifier https://ror.org/05pjsgx75,
    active, domain iitk.ac.in, display names "IIT Kanpur" and "IITK". This records a MEMBERSHIP, not a
    surface the institution operates: no ROR contract is saved under this slug and none should be. The
    entry exists because a registry registration is a fact about the institution, and deleting it to avoid
    a shared host would destroy a real institutional identity record.
  humanURL: https://ror.org/05pjsgx75
  baseURL: https://api.ror.org/v2/organizations/05pjsgx75
  x-operator: registry
  x-operator-basis: >-
    ror.org is an identifier registry IIT Kanpur is REGISTERED IN. The registry is operated by ROR; the
    registration is IIT Kanpur's.
