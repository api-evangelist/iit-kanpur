- aid: iit-kanpur:iit-kanpur-koha-rest-api
  name: IIT Kanpur PKK Library Koha REST API
  description: >-
    The REST API of the Koha 23.11 integrated library system that the P.K. Kelkar Library self-hosts at
    libserv.iitk.ac.in. Verified live on 2026-09-01: the spec is served at /api/v1 (Swagger 2.0 on the
    wire, 667KB), a Swagger UI renders at /api/v1/.html, /api/v1/public/libraries returns IIT Kanpur's
    own library records with no authentication, and staff endpoints such as /api/v1/libraries return 401
    Authentication failure. This is ONE API with 64 resource groups, not 64 APIs. The 64 OpenAPI documents
    below are per-tag splits of a single source contract (openapi/_original/iit-kanpur-library-rest.yaml)
    produced by the API Evangelist refine step, and they are listed here as properties of one surface
    rather than as 64 separate entries.
  humanURL: https://libserv.iitk.ac.in/api/v1/.html
  baseURL: https://libserv.iitk.ac.in/api/v1
  x-operator: institution
  x-operator-basis: >-
    Host libserv.iitk.ac.in is under the institution's own registrable domain iitk.ac.in, and Koha is
    open-source software the library installs and runs itself — there is no vendor operating this endpoint.
    The CONTRACT, however, is authored by the Koha Development Team (info.contact, GPL v3), not by IIT
    Kanpur; the institution operates the service, the community wrote the spec.
  x-contract-author: Koha Development Team (https://koha-community.org/)
